<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>자리 뽑기 Ultimate Edition</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
rel="stylesheet"
>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:
    'Noto Sans KR',
    'Poppins',
    sans-serif;
}

body{

    min-height:100vh;

    background:

    radial-gradient(
    circle at center,
    #1e3a2f 0%,
    #0f1f18 100%
    );

    color:white;

    overflow-x:hidden;

    padding:30px;
}

/* =========================
   움직이는 네온 조명
========================= */

body::before{

    content:"";

    position:fixed;

    width:700px;
    height:700px;

    border-radius:50%;

    background:

    radial-gradient(
    circle,
    rgba(16,185,129,.18),
    transparent
    );

    top:-200px;
    left:-200px;

    animation:
    glowMove
    16s
    linear
    infinite;

    pointer-events:none;

    z-index:-1;
}

@keyframes glowMove{

    0%{

        transform:
        translate(0,0);

    }

    50%{

        transform:
        translate(
        700px,
        300px
        );

    }

    100%{

        transform:
        translate(0,0);

    }
}

/* =========================
   상단
========================= */

header{

    text-align:center;

    margin-bottom:25px;
}

h1{

    font-size:44px;

    font-weight:700;

    letter-spacing:-1px;

    text-shadow:

    0 0 15px
    rgba(16,185,129,.5);
}

.subtitle{

    color:#a7f3d0;

    margin-top:8px;

    font-size:14px;

    letter-spacing:3px;

}

/* =========================
   버튼
========================= */

.control-panel{

    text-align:center;

    margin-bottom:15px;
}

.btn-draw{

    border:none;

    cursor:pointer;

    border-radius:50px;

    padding:

    16px
    50px;

    font-size:25px;

    font-weight:700;

    color:white;

    background:

    linear-gradient(
    135deg,
    #10b981,
    #059669
    );

    box-shadow:

    0 0 20px
    rgba(16,185,129,.6),

    0 10px 30px
    rgba(16,185,129,.35);

    transition:.3s;
}

.btn-draw:hover{

    transform:
    translateY(-3px)
    scale(1.03);

}

/* =========================
   교실 앞
========================= */

.classroom-front{

    width:100%;

    max-width:1150px;

    margin:0 auto 35px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:

    15px
    30px;

    border-radius:20px;

    backdrop-filter:
    blur(12px);

    background:

    rgba(255,255,255,.05);

    border:

    1px solid
    rgba(255,255,255,.1);

}

.side-label{

    color:#34d399;

    font-weight:700;
}

.board-center{

    font-size:24px;

    font-weight:700;

    letter-spacing:4px;

}

/* =========================
   모둠 전체
========================= */

.grid-container{

    width:100%;

    max-width:1200px;

    margin:auto;

    display:flex;

    justify-content:center;

    gap:35px;

    flex-wrap:wrap;

}

/* =========================
   모둠 페어 기본 및 가로 점선 스타일 (3~4, 5~6)
========================= */

.group-pair{

    display:flex;

    gap:20px;

    padding:24px;

    border-radius:25px;

    backdrop-filter:
    blur(16px);

    background:

    rgba(255,255,255,.04);

    border:

    1px solid
    rgba(255,255,255,.08);

    box-shadow:

    0 15px 35px
    rgba(0,0,0,.25);

    position: relative;

}

/* 3~4, 5~6 중앙 가로 점선 */
.group-pair.split-horizontal::after {
    content: "";
    position: absolute;
    left: 24px;

    width: calc(100% - 48px);
    top: 50%;
    border-top: 2px dashed rgba(16, 185, 129, 0.6);
    pointer-events: none;

}

/* =========================
   1~2구역 전용: 분할선
   위치는 JS가 실제 크기 측정 후 style로 직접 주입
========================= */

.group-pair.custom-dashed-1-2 {
    position: relative;

}

.divider-v,
.divider-h-left,
.divider-h-right {
    position: absolute;
    pointer-events: none;
    z-index: 2;
}

.divider-v {
    width: 0;

    border-left: 2px dashed rgba(16, 185, 129, 0.7);
}

.divider-h-left,
.divider-h-right {
    height: 0;

    border-top: 2px dashed rgba(16, 185, 129, 0.7);
}

.group-column{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:12px;

}

/* =========================
   좌석 기본 디자인 및 스케일 모션
========================= */

.seat{

    width:110px;

    height:75px;

    border-radius:14px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:5px;

    font-size:18px;

    font-weight:700;

    position:relative;

    cursor:pointer;

    user-select:none;

    color: #ffffff;

    transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), 
                border-color 0.3s ease, 
                box-shadow 0.3s ease, 
                background-color 0.3s ease;

    backdrop-filter:
    blur(10px);

    background:

    rgba(255,255,255,.06);

    border:

    2px solid
    rgba(255,255,255,.12);

    z-index: 1;
}

#main-classroom .seat:not(.hidden):hover {
    transform: scale(1.12);
    z-index: 5;
    background: rgba(255, 255, 255, 0.12);

    border-color: rgba(52, 211, 153, 0.6);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);

}

.seat.selected {
    transform: scale(1.2) !important; 
    border-color: #10b981 !important;

    box-shadow: 0 0 15px rgba(16, 185, 129, 0.6), 0 10px 25px rgba(0, 0, 0, 0.4);

    background: rgba(16, 185, 129, 0.15) !important;
    z-index: 10 !important;
}

/* =========================
   가림막 모드
========================= */

.seat.hidden{

    background:#111827;

    color: transparent;

    border:

    2px solid
    rgba(255,255,255,.15);

    box-shadow:

    inset 0 0 20px
    rgba(0,0,0,.8);
}

.seat.hidden::after{

    content:"?";

    position:absolute;

    left:50%;
    top:50%;

    transform:
    translate(-50%,-50%);

    color: #ffffff;

    font-size:40px;

    font-weight:900;

    text-shadow:

    0 0 10px white,
    0 0 20px white;

}

/* 공개 */

.seat.revealed{
    color: #ffffff;
    animation:
    revealPop
    .4s ease;

}

@keyframes revealPop{

    0%{
        transform: scale(.7);

    }

    70%{
        transform: scale(1.15);

    }

    100%{
        transform: scale(1);

    }
}

/* 뽑는 중 */

.seat.active{

    background:

    linear-gradient(
    135deg,
    #10b981,
    #34d399
    );

    color: white;

    transform:
    scale(1.08);

    box-shadow:

    0 0 15px
    #10b981,

    0 0 30px
    #10b981;

}

/* =========================
   교실 뒤
========================= */

.classroom-back{

    max-width:1150px;

    margin:

    35px auto 0;

    text-align:center;

    padding:20px;

    border-radius:20px;

    backdrop-filter:
    blur(12px);

    background:

    rgba(255,255,255,.05);

    border:

    1px solid
    rgba(255,255,255,.1);

    font-size:30px;

    font-weight:700;

    color:#d1fae5;

}

/* =========================
   우측 상단 설정 버튼
========================= */

.settings-fab{
    position: fixed;
    top: 24px;
    right: 24px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(12px);
    color: #34d399;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 200;
    transition: .25s;
    box-shadow: 0 6px 18px rgba(0,0,0,.3);
}

.settings-fab:hover{
    transform: rotate(35deg) scale(1.08);
    border-color: rgba(52,211,153,.6);
}

/* =========================
   설정 오버레이 / 패널
========================= */

.settings-overlay{
    display:none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(3px);
    z-index: 300;
    justify-content: flex-end;
}

.settings-panel{
    width: min(420px, 92vw);
    height: 100%;
    background: linear-gradient(160deg, #163529, #0f1f18);
    border-left: 1px solid rgba(255,255,255,.1);
    padding: 28px 24px;
    overflow-y: auto;
    box-shadow: -10px 0 40px rgba(0,0,0,.4);
    animation: slideIn .25s ease;
}

@keyframes slideIn{
    from{ transform: translateX(30px); opacity:0; }
    to{ transform: translateX(0); opacity:1; }
}

.settings-panel h2{
    font-size: 20px;
    color: #a7f3d0;
    margin-bottom: 6px;
}

.settings-panel .settings-desc{
    font-size: 12.5px;
    color: #cbd5e1;
    margin-bottom: 20px;
    line-height: 1.5;
}

.settings-close{
    float: right;
    cursor: pointer;
    color: #cbd5e1;
    font-size: 22px;
    background: none;
    border: none;
    line-height: 1;
}

.settings-close:hover{ color: #fff; }

.no-together-list{
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 14px;
}

.no-together-row{
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.no-together-row .row-top{
    display:flex;
    align-items:center;
    justify-content: space-between;
}

.row-title{
    font-size: 12px;
    color: #34d399;
    font-weight: 700;
    letter-spacing: .5px;
}

.row-remove{
    background:none;
    border:none;
    color:#f87171;
    cursor:pointer;
    font-size: 13px;
    font-weight:700;
}

.type-toggle-group{
    display:flex;
    gap: 6px;
}

.type-toggle-btn{
    flex: 1;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.15);
    color: rgba(255,255,255,.55);
    border-radius: 8px;
    padding: 7px 4px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition:.2s;
}

.type-toggle-btn:hover{
    border-color: rgba(52,211,153,.5);
}

.type-toggle-btn.active{
    background: rgba(52,211,153,.18);
    border-color: #34d399;
    color: #34d399;
}

.slot-inputs{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
}

.slot-inputs select{
    flex: 1 1 auto;
    min-width: 90px;
    background: rgba(0,0,0,.35);
    color: #fff;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px;
    padding: 8px 6px;
    font-size: 13px;
    outline: none;
}

.slot-inputs select option{
    background:#132720;
    color:#fff;
}

.tab-add-btn{
    background: rgba(52,211,153,.12);
    border: 1px dashed rgba(52,211,153,.5);
    color: #34d399;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 700;
    align-self: flex-start;
}

.tab-add-btn:hover{ background: rgba(52,211,153,.22); }
.tab-add-btn:disabled{
    opacity: .35;
    cursor: not-allowed;
}

.add-rule-btn{
    width: 100%;
    background: rgba(59,130,246,.15);
    border: 1px solid rgba(59,130,246,.4);
    color: #93c5fd;
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 18px;
}
.add-rule-btn:hover{ background: rgba(59,130,246,.25); }

.settings-save-btn{
    width: 100%;
    background: linear-gradient(135deg, #10b981, #059669);
    border: none;
    color: #fff;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(16,185,129,.35);
}
.settings-save-btn:hover{ filter: brightness(1.08); }

.settings-empty{
    text-align:center;
    color: rgba(255,255,255,.35);
    font-size: 13px;
    padding: 20px 0;
}

/* =========================
   저장 / 기록 버튼 + 기록 모달
========================= */

.history-btn-wide{
    width: 100%;
    max-width: 1150px;
    margin: 0 auto 15px;
    display: block;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.15);
    color: #a7f3d0;
    border-radius: 16px;
    padding: 16px 20px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    text-align:center;
    transition:.25s;
}
.history-btn-wide:hover{
    background: rgba(255,255,255,.09);
    border-color: rgba(52,211,153,.5);
}

.history-overlay{
    display:none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(3px);
    z-index: 300;
    align-items: center;
    justify-content: center;
}

.history-modal{
    width: min(560px, 92vw);
    max-height: 78vh;
    overflow-y: auto;
    background: linear-gradient(160deg, #163529, #0f1f18);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 22px;
    padding: 26px;
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
}

.history-modal h2{
    color:#a7f3d0;
    font-size: 20px;
    margin-bottom: 16px;
}

.history-item{
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    display:flex;
    justify-content: space-between;
    align-items:center;
    transition:.2s;
}
.history-item:hover{
    background: rgba(52,211,153,.12);
    border-color: rgba(52,211,153,.5);
}

.history-item .h-time{
    font-size: 14px;
    font-weight: 700;
    color:#fff;
}
.history-item .h-sub{
    font-size: 11.5px;
    color: rgba(255,255,255,.4);
    margin-top:2px;
}

.history-item .h-del{
    background:none;
    border:none;
    color:#f87171;
    font-size: 13px;
    cursor:pointer;
    padding: 6px 8px;
}

.toast-msg{
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff;
    padding: 14px 26px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 14.5px;
    box-shadow: 0 10px 30px rgba(16,185,129,.5);
    z-index: 400;
    opacity: 0;
    pointer-events: none;
    transition: .3s ease;
}
.toast-msg.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* =========================
   모바일 최적화
========================= */

@media(max-width:900px){

    body{
        padding:15px;

    }

    h1{
        font-size:30px;

    }

    .seat{
        width:82px;
        height:60px;
        font-size:13px;

    }

    /* 모둠이 서로 겹치지 않고 세로로 정렬되도록 수정 */
    .grid-container {
        flex-direction: column;

        align-items: center;
    }

    /* 상자 너비가 100%로 퍼져서 점선이 튀어나오는 문제 해결 */
    .group-pair{
        width: max-content;

        justify-content:center;
    }

    .classroom-front{
        font-size:14px;

    }

    .classroom-back{
        font-size:20px;

    }

    .settings-fab{
        top: 14px;
        right: 14px;
        width: 44px;
        height: 44px;
        font-size: 20px;
    }

    .settings-panel{
        padding: 22px 16px;
    }

    .history-btn-wide{
        font-size: 14px;
        padding: 14px 16px;
    }
}

</style>

</head>

<body>

<button class="settings-fab" onclick="openSettingsPanel()" title="같은 모둠 금지 설정">⚙️</button>

<div class="settings-overlay" id="settings-overlay">
    <div class="settings-panel">
        <button class="settings-close" onclick="closeSettingsPanel()">✕</button>
        <h2>같은 모둠 금지 설정</h2>
        <div class="settings-desc">
            초록 점선으로 나뉜 <strong>진짜 모둠</strong> 기준으로 "모둠만" 금지하거나, <strong>바로 옆/앞뒤로 붙는 자리</strong> 기준으로 "앞뒤좌우만" 금지하거나, 둘 다 적용할 수 있어요.<br>
            조합마다 범위를 따로 선택하세요. 한 조합에 2~4명까지 지정 가능하고, 저장 즉시 뽑기와 수동 자리 교환 모두에 적용됩니다.<br><br>
            ※ 별도 설정 없이도, <strong>가장 최근에 저장한 기록</strong>과 같은 자리(같은 위치)에는 자동으로 다시 배정되지 않습니다.
        </div>

        <div class="no-together-list" id="no-together-list"></div>

        <button class="add-rule-btn" onclick="addNoTogetherRule()">+ 금지 조합 추가</button>
        <button class="settings-save-btn" onclick="saveNoTogetherRules()">설정 저장</button>
    </div>
</div>

<div class="history-overlay" id="history-overlay">
    <div class="history-modal">
        <h2>📜 저장된 배치 기록</h2>
        <div id="history-list"></div>
    </div>
</div>

<div class="toast-msg" id="toast-msg"></div>

<header>

    <h1>
        자리 뽑기
    </h1>

    <div class="subtitle">
        RANDOM SEAT DRAW SYSTEM
    </div>

</header>

<div class="control-panel">

    <button
        class="btn-draw"
        onclick="drawSeats()"
    >
        자리 뽑기
    </button>

</div>

<div class="control-panel">
    <button class="btn-draw" style="background: linear-gradient(135deg, #f59e0b, #d97706); font-size: 16px; padding: 10px 24px; box-shadow: none; border-radius: 12px;" onclick="saveCurrentSeating()">
        💾 저장
    </button>
</div>

<button class="history-btn-wide" onclick="openHistoryModal()">🗂️ 기록 보기 (저장된 배치 불러오기)</button>

<div class="classroom-front">

    <div class="side-label">
        창가
    </div>

    <div class="board-center">
  
        교실 앞
    </div>

    <div class="side-label">
        문
    </div>

</div>

<div id="main-classroom" class="grid-container">

    <div class="group-pair custom-dashed-1-2">
        
        <div class="divider-v"></div>
        <div class="divider-h-left"></div>
        <div class="divider-h-right"></div>

        <div class="group-column">
            <div class="seat"></div>
        
            <div class="seat"></div>
            <div class="seat"></div>
        </div>

        <div class="group-column">
            <div class="seat"></div>
            <div class="seat"></div>
            <div class="seat"></div>
        </div>

    </div>

    <div class="group-pair split-horizontal">

        
        <div class="group-column">
            <div class="seat"></div>
            <div class="seat"></div>
            <div class="seat"></div>
            <div class="seat"></div>
        </div>

        <div class="group-column">
            <div class="seat"></div>
            <div class="seat"></div>
    
            <div class="seat"></div>
            <div class="seat"></div>
        </div>

    </div>

    <div class="group-pair split-horizontal">

        <div class="group-column">
            <div class="seat"></div>
            <div class="seat"></div>
            <div class="seat"></div>
            
            <div class="seat"></div>
        </div>

        <div class="group-column">
            <div class="seat"></div>
            <div class="seat"></div>
            <div class="seat"></div>
            <div class="seat"></div>
        </div>

    </div>

</div>

<div class="classroom-back">
    사물함
</div>

<script>

const students = [
    "정지아나", "태아연", "김서온", "임시하",
   
    "권재아", "정예준", "정연우", "옥나경",
    "마수현", "정서원", "윤지민", "강동은",
    "장재윤", "최윤우", "장하연", "김나현",
    "김민재", "이송하", "최다은", "정루완",
    "이현진", "최유준"
];

let firstSelectedSeat = null;

function shuffle(array){
    const arr = [...array];
    for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
}

/* =========================================================
   같은 모둠 / 앞뒤좌우 금지 설정
   - 저장 형태: [{ names:["철수","영희"], type:"group"|"adjacent"|"both" }, ...]
   - localStorage key: seatDraw_noTogetherRules
========================================================= */

const NO_TOGETHER_KEY = "seatDraw_noTogetherRules";
const HISTORY_KEY = "seatDraw_history";

function loadNoTogetherRules(){
    try{
        const raw = localStorage.getItem(NO_TOGETHER_KEY);
        if(!raw) return [];
        const parsed = JSON.parse(raw);
        if(!Array.isArray(parsed)) return [];
        return parsed
            .filter(r => r && Array.isArray(r.names) && r.names.length >= 2)
            .map(r => ({
                names: r.names,
                type: (r.type === "group" || r.type === "adjacent" || r.type === "both") ? r.type : "both"
            }));
    }catch(e){
        return [];
    }
}

// 초록 점선이 실제로 나누는 "진짜 모둠"을 group-pair별로 계산해서 반환
// - 6명(3+3) 계단식 구역(custom-dashed-1-2): 모둠A = 왼쪽[0,1] + 오른쪽[0], 모둠B = 왼쪽[2] + 오른쪽[1,2]
// - 8명(4+4) 수평 구역(split-horizontal): 모둠A = 왼쪽[0,1] + 오른쪽[0,1], 모둠B = 왼쪽[2,3] + 오른쪽[2,3]
function getRealGroups(){
    const groups = [];

    document.querySelectorAll("#main-classroom .group-pair").forEach(pair => {
        const cols = Array.from(pair.querySelectorAll(".group-column"))
            .map(col => Array.from(col.querySelectorAll(".seat")));
        if(cols.length !== 2) return;

        const [left, right] = cols;

        if(pair.classList.contains("custom-dashed-1-2") && left.length === 3 && right.length === 3){
            // 계단식 3+3 분할
            groups.push([left[0], left[1], right[0]]);
            groups.push([left[2], right[1], right[2]]);
        } else if(pair.classList.contains("split-horizontal")){
            // 수평 절반 분할 (짝수 길이 기준으로 반씩)
            const half = Math.floor(left.length / 2);
            groups.push([...left.slice(0, half), ...right.slice(0, half)]);
            groups.push([...left.slice(half), ...right.slice(half)]);
        } else {
            // 알 수 없는 구조는 안전하게 group-pair 전체를 하나의 모둠으로 취급
            groups.push([...left, ...right]);
        }
    });

    return groups;
}

// 물리적으로 "앞뒤좌우"로 붙어있는 좌석 쌍(seat DOM 기준) 목록을 계산
// - 같은 group-column 안에서 바로 위/아래 (앞뒤)
// - 같은 group-pair 안, 서로 다른 group-column의 같은 행(=마주보는 좌우 짝)
function getAdjacentSeatPairs(){
    const pairs = [];

    document.querySelectorAll("#main-classroom .group-pair").forEach(pair => {
        const cols = Array.from(pair.querySelectorAll(".group-column"))
            .map(col => Array.from(col.querySelectorAll(".seat")));

        cols.forEach(colSeats => {
            for(let i = 0; i < colSeats.length - 1; i++){
                pairs.push([colSeats[i], colSeats[i+1]]);
            }
        });

        if(cols.length === 2){
            const [left, right] = cols;
            const len = Math.min(left.length, right.length);
            for(let i = 0; i < len; i++){
                pairs.push([left[i], right[i]]);
            }
        }
    });

    return pairs;
}

// 이름 조회 함수(nameOf)를 받아 규칙 위반 여부를 판정하는 공통 로직
function checkRulesViolation(rules, nameOf){
    if(rules.length === 0) return false;

    const needsGroupCheck = rules.some(r => r.type === "group" || r.type === "both");
    const needsAdjCheck   = rules.some(r => r.type === "adjacent" || r.type === "both");

    if(needsGroupCheck){
        const groups = getRealGroups();
        const groupNameSets = groups.map(seatArr => {
            const set = new Set();
            seatArr.forEach(seatEl => {
                const n = nameOf(seatEl);
                if(n) set.add(n);
            });
            return set;
        });

        for(const rule of rules){
            if(rule.type !== "group" && rule.type !== "both") continue;
            for(const names of groupNameSets){
                if(rule.names.every(n => names.has(n))) return true;
            }
        }
    }

    if(needsAdjCheck){
        const adjacentPairs = getAdjacentSeatPairs();
        for(const [seatA, seatB] of adjacentPairs){
            const nameA = nameOf(seatA);
            const nameB = nameOf(seatB);
            if(!nameA || !nameB) continue;
            for(const rule of rules){
                if(rule.type !== "adjacent" && rule.type !== "both") continue;
                if(rule.names.includes(nameA) && rule.names.includes(nameB)) return true;
            }
        }
    }

    return false;
}

// 셔플 결과(이름 배열, seats 순서와 1:1 대응)가 금지 규칙을 위반하는지 체크
function violatesNoTogetherRules(namesInSeatOrder, seats, rules){
    const seatToName = new Map();
    seats.forEach((seatEl, i) => seatToName.set(seatEl, namesInSeatOrder[i]));
    return checkRulesViolation(rules, seatEl => seatToName.get(seatEl));
}

// 현재 화면에 실제로 배정되어 있는 이름들만으로 규칙 위반 여부 체크 (수동 스왑 검증용)
function violatesNoTogetherRulesCurrent(rules){
    return checkRulesViolation(rules, seatEl => seatEl.dataset.name || "");
}

async function drawSeats(){
    if(firstSelectedSeat) {
        firstSelectedSeat.classList.remove("selected");
        firstSelectedSeat = null;
    }

    // 메인 배치판의 좌석들만 타겟팅하도록 수정
    const seats = document.querySelectorAll("#main-classroom .seat");
    seats.forEach(seat=>{
        seat.className = "seat"; 
        seat.textContent = "";
    });

    // 가장 최근에 저장된 기록 로드 (동일 위치 중복 방지용)
    const history = loadHistory();
    const lastRecord = history.length > 0 ? history[0] : null;
    const lastSeatNames = lastRecord ? lastRecord.seatNames : [];

    // 최신 저장된 "같은 모둠 금지" 규칙 로드
    const noTogetherRules = loadNoTogetherRules();

    // [핵심 제한 로직] 직전 기록과 같은 위치 중복 없음 + 같은 모둠 금지 조합 없음을 만족할 때까지 무작위 재배치 시도
    let shuffled;
    let attempts = 0;
    let isValid = false;

    while (!isValid && attempts < 5000) {
        shuffled = shuffle(students);
        isValid = true;
        
        for (let i = 0; i < shuffled.length; i++) {
            // 가장 최근 저장 기록에서 같은 자리(같은 위치)에 앉았던 학생과 이번에 같은 자리면 무효 처리
            if (lastSeatNames[i] && shuffled[i] === lastSeatNames[i]) {
                isValid = false;
                break;
            }
        }

        if (isValid && violatesNoTogetherRules(shuffled, seats, noTogetherRules)) {
            isValid = false;
        }

        attempts++;
    }

    // 예외 처리: 극단적인 스왑 불가능 상황 방지
    if (!isValid) {
        alert("현재 조건(최근 기록과 동일 위치 방지 + 금지 조합 설정)을 모두 만족하는 배치를 찾지 못했습니다. 설정을 다시 확인해주세요.");
        return;
    }

    for(let i=0; i<25; i++){
        seats.forEach(seat=>{
            seat.classList.add("active");
            seat.textContent = students[Math.floor(Math.random() * students.length)];
        });
        await new Promise(resolve=>setTimeout(resolve, 70));
    }

    seats.forEach((seat,index)=>{
        seat.classList.remove("active");
        seat.textContent = shuffled[index];
        seat.dataset.name = shuffled[index];
        seat.classList.add("hidden");
    });
}

document.addEventListener("click", function(e){
    const targetSeat = e.target;

    if (!targetSeat.classList.contains("seat")) return;

    if (targetSeat.classList.contains("hidden")) {
        targetSeat.classList.remove("hidden");
        targetSeat.classList.add("revealed");
        return;
    }

    if (targetSeat.classList.contains("revealed")) {
        if (firstSelectedSeat === targetSeat) {
            targetSeat.classList.remove("selected");
            firstSelectedSeat = null;
        
            return;
        }

        if (!firstSelectedSeat) {
            firstSelectedSeat = targetSeat;
            targetSeat.classList.add("selected");
        } 
        else {
            const seat1 = firstSelectedSeat;
            const seat2 = targetSeat;

    
            seat2.classList.add("selected");

            setTimeout(() => {
                const tempText = seat1.textContent;
                const tempName = seat1.dataset.name;

                seat1.textContent = seat2.textContent;
                seat1.dataset.name = seat2.dataset.name;

                seat2.textContent = tempText;
                seat2.dataset.name = tempName;

                seat1.classList.remove("selected");
                seat2.classList.remove("selected");

                // 스왑 후 "같은 모둠 금지" 규칙(모둠 동석 + 앞뒤좌우 인접) 위반 체크
                const rules = loadNoTogetherRules();
                if(violatesNoTogetherRulesCurrent(rules)){
                    // 위반이면 즉시 원상복구
                    const revertText = seat1.textContent;
                    const revertName = seat1.dataset.name;

                    seat1.textContent = seat2.textContent;
                    seat1.dataset.name = seat2.dataset.name;

                    seat2.textContent = revertText;
                    seat2.dataset.name = revertName;

                    showToast("⚠️ 금지 조합 설정에 위반되어 되돌렸습니다");
                }
            }, 250);

            firstSelectedSeat = null;
        }
    }
});

// 초기 로드 시 메인 배치판 좌석 텍스트만 청소
document.querySelectorAll("#main-classroom .seat").forEach(seat=>{
    seat.textContent = "";
});

function updateDividers() {
    // 모든 1~2구역 전용 점선들을 찾아서(이전 판 포함) 업데이트하도록 수정
    const pairs = document.querySelectorAll(".group-pair.custom-dashed-1-2");
    
    pairs.forEach(pair => {
        const divV     = pair.querySelector(".divider-v");
        const divHL    = pair.querySelector(".divider-h-left");
        const divHR    = pair.querySelector(".divider-h-right");
        if (!divV || !divHL || !divHR) return;

        const cols = pair.querySelectorAll(".group-column");
        if (cols.length < 2) return;

        const leftCol  = cols[0];
        const rightCol = cols[1];

        const leftSeats  = leftCol.querySelectorAll(".seat");
        const rightSeats = rightCol.querySelectorAll(".seat");
        if (leftSeats.length < 2 || rightSeats.length < 2) return;

        const pairRect   = pair.getBoundingClientRect();
        const leftSeat1  = leftSeats[0].getBoundingClientRect();
        const leftSeat2  = leftSeats[1].getBoundingClientRect();

        const rightSeat1 = rightSeats[0].getBoundingClientRect();
        const rightSeat2 = rightSeats[1].getBoundingClientRect();

        const toRelY = (absY) => absY - pairRect.top;
        const toRelX = (absX) => absX - pairRect.left;

        const midX = toRelX((leftSeat1.right + rightSeat1.left) / 2);

        const leftLineY  = toRelY((leftSeat2.bottom + leftSeats[2]?.getBoundingClientRect().top ?? leftSeat2.bottom) / 2);
        const rightLineY = toRelY((rightSeat1.bottom + rightSeat2.top) / 2);

        divV.style.left   = midX + "px";
        divV.style.top    = rightLineY + "px";
        divV.style.height = (leftLineY - rightLineY) + "px";

        divHL.style.left  = toRelX(leftSeat1.left) + "px";
        divHL.style.width = (midX - toRelX(leftSeat1.left)) + "px";
        divHL.style.top   = leftLineY + "px";

        divHR.style.left  = midX + "px";
        divHR.style.width = (toRelX(rightSeat1.right) - midX) + "px";
        divHR.style.top   = rightLineY + "px";
    });
}

window.addEventListener("load",   updateDividers);
window.addEventListener("resize", updateDividers);

/* =========================================================
   같은 모둠 금지 설정 패널 UI
========================================================= */

let editingRules = []; // [{ id, names:[...], type:"group"|"adjacent"|"both" }, ...] 패널 열려있는 동안의 임시 편집 상태

function makeRuleId(){
    return "r" + Date.now() + Math.floor(Math.random()*1000);
}

function openSettingsPanel(){
    // 저장된 규칙을 불러와 편집 상태로 복사
    const saved = loadNoTogetherRules();
    editingRules = saved.length
        ? saved.map(r => ({ id: makeRuleId(), names: [...r.names], type: r.type }))
        : [];

    renderNoTogetherList();
    document.getElementById("settings-overlay").style.display = "flex";
}

function closeSettingsPanel(){
    document.getElementById("settings-overlay").style.display = "none";
}

function addNoTogetherRule(){
    editingRules.push({ id: makeRuleId(), names: ["", ""], type: "both" });
    renderNoTogetherList();
}

function removeNoTogetherRule(id){
    editingRules = editingRules.filter(r => r.id !== id);
    renderNoTogetherList();
}

function addSlotToRule(id){
    const rule = editingRules.find(r => r.id === id);
    if(!rule) return;
    if(rule.names.length >= 4) return;
    rule.names.push("");
    renderNoTogetherList();
}

function updateRuleSlot(id, slotIndex, value){
    const rule = editingRules.find(r => r.id === id);
    if(!rule) return;
    rule.names[slotIndex] = value;
}

function updateRuleType(id, type){
    const rule = editingRules.find(r => r.id === id);
    if(!rule) return;
    rule.type = type;
    renderNoTogetherList();
}

function renderNoTogetherList(){
    const list = document.getElementById("no-together-list");
    list.innerHTML = "";

    if(editingRules.length === 0){
        const empty = document.createElement("div");
        empty.className = "settings-empty";
        empty.textContent = "등록된 금지 조합이 없습니다. 아래 버튼으로 추가해보세요.";
        list.appendChild(empty);
        return;
    }

    const typeOptions = [
        { value: "group",    label: "모둠만" },
        { value: "adjacent", label: "앞뒤좌우만" },
        { value: "both",     label: "둘 다" }
    ];

    editingRules.forEach((rule, idx) => {
        const row = document.createElement("div");
        row.className = "no-together-row";

        const top = document.createElement("div");
        top.className = "row-top";

        const title = document.createElement("div");
        title.className = "row-title";
        title.textContent = `금지 조합 ${idx + 1} (${rule.names.length}명)`;

        const removeBtn = document.createElement("button");
        removeBtn.className = "row-remove";
        removeBtn.textContent = "삭제";
        removeBtn.onclick = () => removeNoTogetherRule(rule.id);

        top.appendChild(title);
        top.appendChild(removeBtn);
        row.appendChild(top);

        // 적용 범위 선택 (모둠만 / 앞뒤좌우만 / 둘 다)
        const typeWrap = document.createElement("div");
        typeWrap.className = "type-toggle-group";

        typeOptions.forEach(opt => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "type-toggle-btn" + (rule.type === opt.value ? " active" : "");
            btn.textContent = opt.label;
            btn.onclick = () => updateRuleType(rule.id, opt.value);
            typeWrap.appendChild(btn);
        });
        row.appendChild(typeWrap);

        const slotWrap = document.createElement("div");
        slotWrap.className = "slot-inputs";

        rule.names.forEach((name, slotIdx) => {
            const select = document.createElement("select");
            const emptyOpt = document.createElement("option");
            emptyOpt.value = "";
            emptyOpt.textContent = "학생 선택";
            select.appendChild(emptyOpt);

            students.forEach(stu => {
                const opt = document.createElement("option");
                opt.value = stu;
                opt.textContent = stu;
                if(stu === name) opt.selected = true;
                select.appendChild(opt);
            });

            select.onchange = (e) => updateRuleSlot(rule.id, slotIdx, e.target.value);
            slotWrap.appendChild(select);
        });

        row.appendChild(slotWrap);

        const addTabBtn = document.createElement("button");
        addTabBtn.className = "tab-add-btn";
        addTabBtn.textContent = rule.names.length >= 4
            ? "최대 4명까지 가능"
            : `+ ${rule.names.length + 1}명으로 늘리기`;
        addTabBtn.disabled = rule.names.length >= 4;
        addTabBtn.onclick = () => addSlotToRule(rule.id);
        row.appendChild(addTabBtn);

        list.appendChild(row);
    });
}

function saveNoTogetherRules(){
    // 유효성 검사: 각 규칙마다 빈 슬롯 없이 최소 2명, 중복 이름 없이 저장
    const cleaned = [];

    for(const rule of editingRules){
        const names = rule.names.map(n => n.trim()).filter(n => n !== "");
        const unique = [...new Set(names)];

        if(unique.length < 2) continue; // 2명 미만이면 무시
        cleaned.push({ names: unique, type: rule.type || "both" });
    }

    localStorage.setItem(NO_TOGETHER_KEY, JSON.stringify(cleaned));
    closeSettingsPanel();
    showToast("금지 조합 설정이 저장되었습니다");
}

/* =========================================================
   현재 배치 저장 / 기록 불러오기
========================================================= */

function loadHistory(){
    try{
        const raw = localStorage.getItem(HISTORY_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
    }catch(e){
        return [];
    }
}

function saveCurrentSeating(){
    const seats = document.querySelectorAll("#main-classroom .seat");
    const names = Array.from(seats).map(seat => seat.dataset.name || seat.textContent.trim());

    if(names.every(n => !n)){
        alert("저장할 배치가 없습니다. 먼저 자리 뽑기를 진행해주세요.");
        return;
    }

    const now = new Date();
    const record = {
        id: "h" + now.getTime(),
        timestamp: now.getTime(),
        label: now.toLocaleString("ko-KR", {
            year: "numeric", month: "2-digit", day: "2-digit",
            hour: "2-digit", minute: "2-digit", second: "2-digit",
            hour12: false
        }),
        seatNames: names
    };

    const history = loadHistory();
    history.unshift(record); // 최신 기록이 위로
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));

    showToast("기록이 저장되었습니다");
}

function openHistoryModal(){
    renderHistoryList();
    document.getElementById("history-overlay").style.display = "flex";
}

function closeHistoryModal(){
    document.getElementById("history-overlay").style.display = "none";
}

function renderHistoryList(){
    const listEl = document.getElementById("history-list");
    const history = loadHistory();
    listEl.innerHTML = "";

    if(history.length === 0){
        const empty = document.createElement("div");
        empty.className = "settings-empty";
        empty.textContent = "저장된 기록이 없습니다. 자리 뽑기 후 '저장' 버튼을 눌러보세요.";
        listEl.appendChild(empty);
        return;
    }

    history.forEach(record => {
        const item = document.createElement("div");
        item.className = "history-item";

        const left = document.createElement("div");
        const timeEl = document.createElement("div");
        timeEl.className = "h-time";
        timeEl.textContent = record.label;
        const subEl = document.createElement("div");
        subEl.className = "h-sub";
        subEl.textContent = `학생 ${record.seatNames.filter(n=>n).length}명 배치 · 클릭하여 불러오기`;
        left.appendChild(timeEl);
        left.appendChild(subEl);

        const delBtn = document.createElement("button");
        delBtn.className = "h-del";
        delBtn.textContent = "삭제";
        delBtn.onclick = (e) => {
            e.stopPropagation();
            deleteHistoryRecord(record.id);
        };

        item.appendChild(left);
        item.appendChild(delBtn);
        item.onclick = () => loadHistoryRecord(record);

        listEl.appendChild(item);
    });
}

function deleteHistoryRecord(id){
    const history = loadHistory().filter(r => r.id !== id);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    renderHistoryList();
}

function loadHistoryRecord(record){
    const seats = document.querySelectorAll("#main-classroom .seat");

    if(firstSelectedSeat){
        firstSelectedSeat.classList.remove("selected");
        firstSelectedSeat = null;
    }

    seats.forEach((seat, i) => {
        const name = record.seatNames[i] || "";
        seat.className = "seat";
        seat.textContent = name;
        seat.dataset.name = name;
        if(name) seat.classList.add("revealed");
    });

    closeHistoryModal();
    showToast(`${record.label} 기록을 불러왔습니다`);
}

/* =========================================================
   토스트 알림
========================================================= */

let toastTimer = null;
function showToast(message){
    const toast = document.getElementById("toast-msg");
    toast.textContent = message;
    toast.classList.add("show");

    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    }, 2200);
}

// 오버레이 바깥(배경) 클릭 시 닫기
document.getElementById("settings-overlay").addEventListener("click", (e) => {
    if(e.target.id === "settings-overlay") closeSettingsPanel();
});
document.getElementById("history-overlay").addEventListener("click", (e) => {
    if(e.target.id === "history-overlay") closeHistoryModal();
});

</script>
